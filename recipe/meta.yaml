{% set name = "pyopengl" %}
{% set version = "3.1.10" %}
package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  - url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
    sha256: c4a02d6866b54eb119c8e9b3fb04fa835a95ab802dd96607ab4cdb0012df8335
    patches:  # [win]
      # Anaconda: PR #177 _size() fix (sysconfig.get_platform() -> arm64 suffix) + GLUT/GLE name fallback.
      - patches/win32-freeglut-load.patch  # [win]
  # Anaconda: GLE 3.1.0 sources for the native Windows GLE build.
  # GLE has no package in Anaconda main.
  # Sources: Debian pool tarball, same hash-pinned copy as
  # mcfletch/pyopengl-glut-binaries tools/arm64-sources.json.
  - url: https://deb.debian.org/debian/pool/main/g/gle/gle_3.1.0.orig.tar.gz  # [win]
    sha256: dc8a74b5632b2c3fc84d33c2bf6ee43210b71b8ddf0a3166a25aeb46620bfa27  # [win]
    folder: gle-3.1.0                                                         # [win]

build:
  number: 1

requirements:
  build:
    - {{ stdlib('c') }}  # [win]
    - {{ compiler('c') }}  # [win]
  host:
    - python
    - pip
    - setuptools >=42.0
    - wheel
    - freeglut {{ freeglut }}  # [win]
  run:
    - python
    - freeglut  # [win]
  run_constrained:
    # https://github.com/mcfletch/pyopengl/blob/3.1.10/numpy-requirements.txt
    - numpy >=2.3  # [py>=311]
    - numpy >=2  # [py>=39 or py<311]
    - numpy <2   # [py<39]

# Reasons why PyTests are disabled:
# - CI doesn`t support GUI - failed to open display ''
# - Package pygame is not in the main channel
# - Windows is not expected to have an X server, GLX tests.
test:
  files:
    - test_win.py
  imports:
    - OpenGL
    - OpenGL.acceleratesupport
    - OpenGL.arrays
    - OpenGL.constants
    - OpenGL.contextdata
    - OpenGL.converters
    - OpenGL.error
    - OpenGL.extensions
    - OpenGL.images
    - OpenGL.latebind
    - OpenGL.lazywrapper
    - OpenGL.logs
    - OpenGL.platform
    - OpenGL.version
    - OpenGL.wrapper
    - OpenGL.AGL
    - OpenGL.EGL  # [linux]
    - OpenGL.GL
    - OpenGL.GL.feedback
    - OpenGL.GL.framebufferobjects
    - OpenGL.GL.glget
    - OpenGL.GL.images
    - OpenGL.GL.pointers
    - OpenGL.GL.selection
    - OpenGL.GL.shaders
    - OpenGL.GL.vboimplementation
    - OpenGL.GLE
    - OpenGL.GLES1  # [linux]
    - OpenGL.GLU
    - OpenGL.GLUT
    - OpenGL.GLX  # [linux]
    - OpenGL.WGL  # [win]
  commands:
    - pip check
    - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"
    # Anaconda: run the Windows DLL verification script. Kept out of
    # an inline `python -c` because cmd.exe mangles `%` even in quotes.
    - python test_win.py  # [win]
  requires:
    - pip
    - libegl-devel  # [linux]

about:
  home: https://mcfletch.github.io/pyopengl
  license: LicenseRef-pyopengl
  license_family: Other
  license_file:
    - license.txt
    - OpenGL/DLLS/gle_COPYING  # [win]
    - OpenGL/DLLS/gle_COPYING.src  # [win]
    - OpenGL/DLLS/gle_AUTHORS  # [win]
  summary: Standard OpenGL bindings for Python
  description: |
    PyOpenGL is the most common cross platform Python binding to OpenGL and related APIs.
    The binding is created using the standard ctypes library, and is provided under a liberal BSD-style Open-Source license.
  doc_url: https://mcfletch.github.io/pyopengl/documentation/index.html
  dev_url: https://github.com/mcfletch/pyopengl

extra:
  recipe-maintainers:
    - almarklein
    - mcfletch
    - tadeu
