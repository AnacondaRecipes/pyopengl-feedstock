{% set name = "pyopengl" %}
{% set version = "3.1.10" %}
package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: c4a02d6866b54eb119c8e9b3fb04fa835a95ab802dd96607ab4cdb0012df8335

build:
  number: 0
  script:
    - {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  # Windows support disabled due to upstream binary distribution issues:
  # - Package includes pre-compiled DLLs (gle*.dll, freeglut*.dll) built with VS2008/VS2010 (vc9/vc10) requiring MSVCR90.dll/MSVCR100.dll
  # - These legacy runtimes are not available in modern conda environments
  # - Removing legacy DLLs breaks compatibility guarantees
  # - Building from source requires significant platform-specific tooling
  skip: true  # [win]

requirements:
  host:
    - python
    - pip
    - setuptools >=42.0
    - wheel
  run:
    - python
  run_constrained:
    # https://github.com/mcfletch/pyopengl/blob/3.1.10/numpy-requirements.txt
    - numpy >=2.3  # [py>=311]
    - numpy >=2  # [py>=39 or py<311]
    - numpy <2   # [py<39]

# Reasons why PyTests are disabled:
# - CI doesn`t support GUI - failed to open display ''
# - Package pygame is not in the main channel
# - Windows is not expected to have an X server, GLX tests.
test:
  imports:
    - OpenGL
    - OpenGL.acceleratesupport
    - OpenGL.arrays
    - OpenGL.constants
    - OpenGL.contextdata
    - OpenGL.converters
    - OpenGL.error
    - OpenGL.extensions
    - OpenGL.images
    - OpenGL.latebind
    - OpenGL.lazywrapper
    - OpenGL.logs
    - OpenGL.platform
    - OpenGL.version
    - OpenGL.wrapper
    - OpenGL.AGL
    - OpenGL.EGL  # [linux]
    - OpenGL.GL
    - OpenGL.GL.feedback
    - OpenGL.GL.framebufferobjects
    - OpenGL.GL.glget
    - OpenGL.GL.images
    - OpenGL.GL.pointers
    - OpenGL.GL.selection
    - OpenGL.GL.shaders
    - OpenGL.GL.vboimplementation
    - OpenGL.GLE
    - OpenGL.GLES1  # [linux]
    - OpenGL.GLU
    - OpenGL.GLUT
    - OpenGL.GLX  # [linux]
    - OpenGL.WGL  # [win]
  commands:
    - pip check
    - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"
  requires:
    - pip
    - libegl-devel  # [linux]

about:
  home: https://mcfletch.github.io/pyopengl
  license: LicenseRef-pyopengl
  license_family: Other
  license_file: license.txt
  summary: Standard OpenGL bindings for Python
  description: |
    PyOpenGL is the most common cross platform Python binding to OpenGL and related APIs.
    The binding is created using the standard ctypes library, and is provided under a liberal BSD-style Open-Source license.
  doc_url: https://mcfletch.github.io/pyopengl/documentation/index.html
  dev_url: https://github.com/mcfletch/pyopengl

extra:
  recipe-maintainers:
    - almarklein
    - mcfletch
    - tadeu
